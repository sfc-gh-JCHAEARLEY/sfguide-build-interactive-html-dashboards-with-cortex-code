  <link rel="stylesheet" href="/libs/katex@0.16.21/katex.min.css" />
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      max-width: 1080px; width: 100%;
      margin: 0 auto; padding: clamp(16px, 4vw, 32px);
      color: light-dark(#1f2937, #e5e7eb);
      background: light-dark(#ffffff, #0f172a);
      line-height: 1.55;
    }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 6px; color: light-dark(#0f172a, #f1f5f9); }
    .lede { margin: 0 0 20px; color: light-dark(#4b5563, #9ca3af); }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; align-items: center; }
    .presets span { font-size: 0.85rem; color: light-dark(#6b7280, #9ca3af); margin-right: 4px; }
    .presets button {
      font: inherit; font-size: 0.9rem; padding: 6px 14px; cursor: pointer;
      border-radius: 999px; border: 1px solid light-dark(#d1d5db, #475569);
      background: light-dark(#ffffff, #1e293b); color: inherit;
    }
    .presets button:hover { border-color: #29b5e8; }
    .presets button[aria-pressed="true"] { border-color: #29b5e8; background: light-dark(#e0f4fc, #0c3a4d); }
    .presets button:focus-visible, textarea:focus-visible { outline: 2px solid #29b5e8; outline-offset: 2px; }
    .panes {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));

    .pane label, .pane .pane-title {
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: light-dark(#6b7280, #9ca3af); margin-bottom: 6px;
    }
    textarea {
      width: 100%; min-height: 260px; resize: vertical; padding: 14px;
      font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border-radius: 8px; border: 1px solid light-dark(#d1d5db, #334155);
      background: light-dark(#f9fafb, #111827); color: inherit;
    }
    .output {
      min-height: 260px; padding: 18px; border-radius: 8px;
      border: 1px solid light-dark(#e5e7eb, #334155);
      background: light-dark(#ffffff, #0b1220);
      display: flex; flex-direction: column; justify-content: center; gap: 12px;
      overflow-x: auto;
    }
    #math { font-size: 1.25rem; transition: opacity .15s; }
    #math.stale { opacity: 0.35; }
    #math .katex-display { margin: 0; }
    .placeholder { color: light-dark(#9ca3af, #64748b); font-style: italic; font-size: 0.95rem; text-align: center; }

      margin: 0; font: 13px/1.5 ui-monospace, Menlo, monospace;
      color: light-dark(#6b7280, #94a3b8);
      background: light-dark(#f3f4f6, #1e293b);
      border-left: 3px solid light-dark(#d1d5db, #475569);
      padding: 8px 12px; border-radius: 4px; white-space: pre-wrap; word-break: break-word;
    }
    .error[hidden] { display: none; }
    .status { margin-top: 8px; font-size: 0.8rem; color: light-dark(#6b7280, #9ca3af); min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Live LaTeX editor</h1>
  <p class="lede">Type LaTeX on the left; KaTeX typesets it on the right as you type. Invalid input shows the parser's message instead of breaking the page.</p>

  <section id="editor">
    <div class="presets" role="group" aria-label="Load a preset">
      <span>Presets:</span>
      <button type="button" data-preset="euler" aria-pressed="false">Euler</button>
      <button type="button" data-preset="gaussian" aria-pressed="false">Gaussian</button>
      <button type="button" data-preset="binomial" aria-pressed="false">Binomial</button>
    </div>

    <div class="panes">
      <div class="pane">
        <label for="src">LaTeX source</label>
        <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </div>
      <div class="pane">
        <div class="pane-title" id="out-title">Rendered</div>
        <div class="output" aria-labelledby="out-title">
          <div id="math" aria-live="polite"></div>
          <pre class="error" id="err" hidden></pre>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
  </section>

  <script src="/libs/katex@0.16.21/katex.min.js"></script>
  <script>
    (function () {
      var PRESETS = {
        euler: 'e^{i\\pi} + 1 = 0',
        gaussian: '\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}',
        binomial: '(x + y)^n = \\sum_{k=0}^{n} \\binom{n}{k} x^{n-k} y^{k}'
      };

      var src = document.getElementById('src');
      var math = document.getElementById('math');
      var err = document.getElementById('err');
      var status = document.getElementById('status');
      var presetButtons = document.querySelectorAll('[data-preset]');

      function showPlaceholder(text) {
        var p = document.createElement('p');
        p.className = 'placeholder';
        p.textContent = text;
        math.replaceChildren(p);
      }

      function render() {
        var tex = src.value;
        if (typeof katex === 'undefined') {
          showPlaceholder('Math library failed to load.');
          return;
        }
        if (!tex.trim()) {
          err.hidden = true;
          math.classList.remove('stale');
          showPlaceholder('Type some LaTeX, or pick a preset.');
          status.textContent = '';
          return;
        }
        try {
          // Render into a detached node first so a parse error leaves the last good output intact.
          var tmp = document.createElement('div');
          katex.render(tex, tmp, { displayMode: true, throwOnError: true, strict: 'ignore', output: 'htmlAndMathml' });
          math.replaceChildren.apply(math, Array.prototype.slice.call(tmp.childNodes));
          math.classList.remove('stale');
          err.hidden = true;
          err.textContent = '';
          status.textContent = 'Rendered.';
        } catch (e) {
          var msg = (e && e.message) ? e.message : String(e);
          err.textContent = msg;
          err.hidden = false;
          if (math.querySelector('.katex')) {
            math.classList.add('stale');
            status.textContent = 'Showing the last valid render.';
          } else {
            showPlaceholder('Nothing to show yet.');
            status.textContent = '';
          }
        }
      }

      function setPressed(name) {
        presetButtons.forEach(function (b) {
          b.setAttribute('aria-pressed', String(b.dataset.preset === name));
        });
      }

      presetButtons.forEach(function (b) {
        b.addEventListener('click', function () {
          src.value = PRESETS[b.dataset.preset];
          setPressed(b.dataset.preset);
          render();
          src.focus();
        });
      });

      src.addEventListener('input', function () {
        var match = null;
        Object.keys(PRESETS).forEach(function (k) { if (PRESETS[k] === src.value) match = k; });
        setPressed(match);
        render();
      });

      src.value = PRESETS.euler;
      setPressed('euler');
      render();
    })();
  </script>
</body>
</html>
